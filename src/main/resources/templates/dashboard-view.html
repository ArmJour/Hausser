<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hausser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard-style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Hausser</div>
            <div class="navbar-menu">
                <a href="#" class="nav-link active">Dasbor</a>
                <a href="#" class="nav-link">Profil</a>
                <a href="#" class="nav-link">Riwayat</a>
                <a href="#" class="nav-link">Chat</a>
                <a href="#" class="nav-link">Sengketa</a>
                <a href="#" class="nav-link">Notifikasi</a>
                <button class="helpdesk-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1C7.03 1 3 5.03 3 10V17C3 18.66 4.34 20 6 20H9V12H5V10C5 6.13 8.13 3 12 3C15.87 3 19 6.13 19 10V12H15V20H18C19.66 20 21 18.66 21 17V10C21 5.03 16.97 1 12 1Z" fill="currentColor"/>
                    </svg>
                    Helpdesk
                </button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <section class="section-left">
            <div class="section-header">
                <h2>Tawaran Kerja</h2>
            </div>
            <div class="scroll-container">
                <div class="card-list">
                    <div th:each="tawaran : ${tawaranKerja}" class="job-card">
                        <div class="job-card-header">
                            <div class="avatar-placeholder"></div>
                            <div class="job-info">
                                <h3 th:text="${tawaran.nama}">Nama Lengkap</h3>
                            </div>
                        </div>
                        <div class="job-details">
                            <div class="detail-row">
                                <span class="detail-label">💵 Gaji</span>
                                <span class="detail-separator">:</span>
                                <span class="detail-value" th:text="${tawaran.gaji}">Rp 5.000.000</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">📍 Lokasi</span>
                                <span class="detail-separator">:</span>
                                <span class="detail-value" th:text="${tawaran.lokasi}">Jl. Ananas</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">📋 Preferensi</span>
                                <span class="detail-separator">:</span>
                                <span class="detail-value" th:text="${tawaran.preferensi}">Bisa memasak</span>
                            </div>
                        </div>
                        <button class="btn-primary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                            </svg>
                            Lihat Profil
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-center">
            <div class="section-header">
                <h2>Negosiasi</h2>
            </div>
            <div class="scroll-container">
                <div class="card-list">
                    <div th:each="nego : ${negosiasi}" class="nego-card">
                        <div class="nego-header">
                            <div class="avatar-placeholder-small"></div>
                            <div class="nego-info">
                                <h3 th:text="${nego.nama}">Nama Lengkap</h3>
                                <p class="nego-update">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                        <circle cx="7" cy="7" r="6.5" stroke="#666" stroke-width="1"/>
                                        <path d="M7 3.5V7H9.5" stroke="#666" stroke-width="1" stroke-linecap="round"/>
                                    </svg>
                                    Update: <span th:text="${nego.update}">2 hours ago</span>
                                </p>
                            </div>
                        </div>
                        <button class="btn-secondary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6C4.9 2 4.01 2.9 4.01 4L4 20C4 21.1 4.89 22 5.99 22H18C19.1 22 20 21.1 20 20V8L14 2ZM16 18H8V16H16V18ZM16 14H8V12H16V14ZM13 9V3.5L18.5 9H13Z"/>
                            </svg>
                            Lihat File
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-right">
            <div class="section-header">
                <h2>Informasi Terkini</h2>
            </div>
            <div class="info-cards">
                <div class="info-card">
                    <div class="info-text">Do you know ...</div>
                    <div class="info-image-placeholder"></div>
                </div>
                <div class="info-card">
                    <div class="info-text">Do you know ...</div>
                    <div class="info-image-placeholder"></div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
