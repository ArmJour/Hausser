<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Hausser</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/registrasi-style.css}">
</head>
<body>

<div class="main-container">

  <div class="sidebar">
    <div class="illustration-top">
      <img th:src="@{/image/node-57.png}" alt="Siklus Kerja">
    </div>

    <div class="illustration-bottom">
      <img th:src="@{/image/node-12.png}" alt="Komunitas Hausser">
    </div>
  </div>

  <div class="form-section">
    <div class="form-wrapper">

      <h2 class="form-title">Daftar sebagai <span th:text="${selectedRole == 'ART' ? 'ART' : 'Majikan'}">User</span></h2>

      <div th:if="${error}" class="alert-error">
        <p th:text="${error}">Error message</p>
      </div>

      <form th:action="@{/register}" method="POST">
        <input type="hidden" name="roleInput" th:value="${selectedRole}">

        <div class="input-grid">
          <div class="form-group">
            <label for="nama">Nama Pengguna</label>
            <input type="text" id="nama" name="namaInput" placeholder="Masukkan nama lengkap" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="emailInput" placeholder="contoh@email.com" required>
          </div>

          <div class="form-group">
            <label for="telp">Nomor Telepon</label>
            <input type="text" id="telp" name="teleponInput" placeholder="+62 ..." required>
          </div>
          <div class="form-group">
            <label for="alamat">Alamat</label>
            <input type="text" id="alamat" name="alamatInput" placeholder="Alamat lengkap" required>
          </div>

          <div class="form-group">
            <label for="pass">Kata Sandi</label>
            <input type="password" id="pass" name="passInput" placeholder="********" required>
          </div>
          <div class="form-group">
            <label for="confirmPass">Konfirmasi Kata Sandi</label>
            <input type="password" id="confirmPass" name="confirmPassInput" placeholder="********" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-register">Daftar</button>
          <a th:href="@{/login}" class="btn-cancel">Batal</a>
        </div>
      </form>
    </div>
  </div>

</div>

</body>
</html>
