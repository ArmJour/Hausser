<!DOCTYPE html>
<!-- PERBAIKAN: Tambahkan xmlns:th agar error merah hilang -->
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hausser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login-style.css">
</head>
<body>

<div class="login-container">
    <!-- Panel Kiri -->
    <div class="left-panel">
        <h1>Selamat datang di Hausser!</h1>
    </div>

    <!-- Panel Kanan -->
    <div class="right-panel">
        <div class="login-form-container">
            <h2>Masuk</h2>

            <!-- Pesan Error -->
            <p th:if="${error}" th:text="${error}" style="color: red; text-align: center; margin-bottom: 10px;"></p>

            <form action="/login" method="POST">
                <div class="input-group">
                    <img src="image/icon-20.svg" class="input-icon">
                    <input type="text" name="usernameInput" placeholder="Nama Pengguna atau Email" required>
                </div>

                <div class="input-group">
                    <img src="image/icon-22.svg" class="input-icon">
                    <input type="password" name="passwordInput" placeholder="Kata Sandi" required>
                </div>

                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="text-remember">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Lupa Kata Sandi?</a>
                </div>

                <button type="submit" class="btn-login">Masuk</button>
            </form>

            <div class="register-link">
                <!-- Link ini akan memuat ulang halaman dengan parameter ?action=signup -->
                Belum punya akun? <a href="/login?action=signup">Buat Akun</a>
            </div>
        </div>
    </div>
</div>

<!-- === POPUP MODAL === -->
<!-- Logika: Jika Java mengirim 'showRoleSelection', ubah style jadi flex. Jika tidak, none (sembunyi) -->
<div id="roleModal" class="modal-overlay"
     th:style="${showRoleSelection == true ? 'display:flex' : 'display:none'}">

    <div class="modal-content">
        <!-- Tombol Close: Kembali ke login biasa -->
        <a href="/login" class="close-btn">&times;</a>

        <h3>Daftar Sebagai?</h3>
        <p>Pilih jenis akun yang ingin Anda buat</p>

        <div class="role-options">
            <a href="/register?role=MAJIKAN" class="role-card">
                <!-- Gunakan emoji atau path gambar/icon yang valid -->
                <div class="role-icon">🏠</div>
                <h4>Majikan</h4>
                <p>Saya mencari pekerja</p>
            </a>

            <a href="/register?role=ART" class="role-card">
                <div class="role-icon">🧹</div>
                <h4>Pekerja (ART)</h4>
                <p>Saya mencari pekerjaan</p>
            </a>
        </div>
    </div>
</div>

</body>
</html>
